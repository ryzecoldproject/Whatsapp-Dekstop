name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Temporary build fix
        shell: pwsh
        run: |
          $file = "main.go"
          $content = Get-Content $file -Raw

          $replacement1 = @"
windowWidth  = 1100
  windowHeight = 750
  windowTitle  = "WhatsAppDezk by RSMV"
  appURL       = "https://web.whatsapp.com"
"@

          $content = $content -replace 'windowWidth\s*=\s*1100\r?\n\s*windowHeight\s*=\s*750', $replacement1
          $content = $content -replace 'if !validateBuildEnvironment\(\) \{\r?\n\s*return\r?\n\s*\}\r?\n\s*runApp\(\)', 'runApp()'

          Set-Content $file $content -NoNewline -Encoding UTF8

      - name: Build Windows x64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -o WhatsApp.exe .

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Windows-x64
          path: WhatsApp.exe
          if-no-files-found: error